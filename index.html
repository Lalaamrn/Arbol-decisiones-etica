<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árbol de Decisiones : Ética Profesional en Ingeniería</title>
  <meta name="description" content="Simulador interactivo de toma de decisiones y consecuencias éticas en ingeniería industrial y ambiental.">
  
  <!-- Tipografía moderna e industrial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Estilos modulares -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN Y CONTROL SUPERIOR -->
  <header class="app-header" role="banner">
    <div class="header-container">
      
      <!-- Marca y Contexto Académico -->
      <div class="brand-section">
        <div class="brand-logo-badge" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">Árbol de Decisiones </span>
          <span class="brand-tag">Ética Profesional en Ingeniería</span>
        </div>
      </div>

      <!-- Barra de Progreso y Migas de Pan -->
      <nav class="nav-center-section" aria-label="Progreso de la sesión">
        <div class="progress-track-wrapper">
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5">
            <div id="progress-fill" class="progress-fill-bar"></div>
          </div>
          <span id="progress-step-text" class="progress-step-label">Portada</span>
        </div>
        <div id="breadcrumbs-container" class="breadcrumbs-container" aria-label="Ruta de navegación">
          <!-- Generado dinámicamente -->
        </div>
      </nav>

      <!-- Botones de Acción Global -->
      <div class="header-actions">
        <!-- Botón Mapa de Decisiones -->
        <button id="btn-open-map" class="btn btn-map-highlight" aria-label="Ver mapa de decisiones interactivo (Atajo: tecla M)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          <span>Ver mapa</span>
        </button>

        <!-- Botón Atrás -->
        <button id="btn-nav-back" class="btn btn-secondary" style="display: none;" aria-label="Volver al paso anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Atrás</span>
        </button>

        <!-- Botón Reiniciar -->
        <button id="btn-nav-restart" class="btn btn-icon-only" aria-label="Reiniciar simulación (Atajo: tecla R)" title="Reiniciar simulación">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>

        <!-- Botón Silenciar / Activar Sonido -->
        <button id="btn-toggle-sound" class="btn btn-icon-only" aria-label="Alternar efectos de sonido" title="Efectos de sonido">
          <span class="sound-state-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </span>
        </button>
      </div>

    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE PANTALLAS DINÁMICAS -->
  <main class="app-viewport">
    <div id="app-main" role="region" aria-live="polite">
      <!-- El contenido de Portada, Situación, Decisión o Consecuencia se renderiza aquí -->
    </div>
  </main>

  <!-- MODAL INTERACTIVO: MAPA GENERAL DEL ÁRBOL -->
  <div id="map-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-map-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title-row">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" color="var(--primary-accent)">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          <h2 id="modal-map-title" class="modal-title">Mapa General del Árbol de Decisiones</h2>
        </div>
        <button id="btn-close-map" class="btn-close-modal" aria-label="Cerrar mapa (Escape)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="modal-map-view"></div>
      </div>
    </div>
  </div>

  <!-- PIE DE PÁGINA ACADÉMICO -->
  <footer class="app-footer">
    <div class="footer-container">
      <div class="footer-academic-info">
        <span>Facultad de Ingeniería • Presentación Digital Interactiva de Ética Profesional</span>
      </div>
      <div class="footer-shortcuts" aria-label="Atajos de teclado">
        <span><kbd>Enter</kbd> / <kbd>Espacio</kbd> Avanzar</span>
        <span><kbd>←</kbd> Atrás</span>
        <span><kbd>A</kbd>/<kbd>B</kbd>/<kbd>C</kbd> o <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> Elegir opción</span>
        <span><kbd>M</kbd> Mapa</span>
        <span><kbd>R</kbd> Reiniciar</span>
      </div>
    </div>
  </footer>

  <!-- SCRIPTS MODULARES -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tree-map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
